name: Aggiorna Screening Eurostoxx50

on:
  schedule:
    - cron: '0 6 * * 1'   # ogni lunedi alle 06:00 UTC (07:00/08:00 ora italiana)
  workflow_dispatch: {}     # permette anche l'avvio manuale dal tab "Actions"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le librerie necessarie
        run: pip install yfinance pandas numpy

      - name: Calcola gli indicatori
        run: python update_screening.py

      - name: Salva il risultato nel repository (commit automatico)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screening_data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Aggiornamento automatico screening $(date -u +%F)"
          git push
